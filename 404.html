<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page not found | Usman Tariq</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .error-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px;}
    .error-code{font-family:var(--font-display);font-size:clamp(4rem,14vw,8rem);font-weight:700;
      background:linear-gradient(135deg,var(--primary),var(--secondary),var(--accent));
      -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;}
  </style>
</head>
<body data-theme="dark">
  <div class="error-page">
    <span class="error-code">404</span>
    <h1>This page took a wrong turn.</h1>
    <p class="muted-note">The page you're looking for doesn't exist — it may have moved or been removed.</p>
    <a href="/" class="btn btn-primary">Back to home</a>
  </div>
</body>
</html>
